<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 600 338">
  <defs>
    <pattern id="grit" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F0F0F0"/>
      <circle cx="2" cy="3" r="0.9" fill="#9A9A9A"/>
      <circle cx="6.5" cy="6.5" r="0.7" fill="#B5B5B5"/>
      <rect x="4" y="1" width="3" height="0.8" fill="#C4C4C4"/>
    </pattern>
  </defs>
  <rect width="600" height="338" fill="#3A3A3A"/>

  <!-- caption card going into the shredder -->
  <rect x="58" y="86" width="94" height="66" rx="8" fill="#F2F2F2" stroke="#1F1F1F" stroke-width="2"/>
  <text x="105" y="132" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" fill="#2B2B2B">CC</text>

  <!-- shredder -->
  <rect x="40" y="150" width="130" height="64" rx="8" fill="#6E6E6E" stroke="#222222" stroke-width="2"/>
  <rect x="50" y="146" width="110" height="9" rx="3" fill="#1D1D1D"/>
  <line x1="50" y1="196" x2="160" y2="196" stroke="#555555" stroke-width="2"/>
  <circle cx="154" cy="172" r="4.5" fill="#E24B4A"/>

  <!-- shredded strips -->
  <g fill="#F2F2F2">
    <rect x="54" y="214" width="7" height="34"/>
    <rect x="66" y="214" width="7" height="24"/>
    <rect x="78" y="214" width="7" height="40"/>
    <rect x="90" y="214" width="7" height="28"/>
    <rect x="102" y="214" width="7" height="36"/>
    <rect x="114" y="214" width="7" height="22"/>
    <rect x="126" y="214" width="7" height="38"/>
    <rect x="138" y="214" width="7" height="27"/>
    <rect x="150" y="214" width="7" height="33"/>
  </g>
  <g fill="#2B2B2B">
    <rect x="79" y="226" width="5" height="6"/>
    <rect x="103" y="232" width="5" height="5"/>
    <rect x="127" y="222" width="5" height="7"/>
  </g>

  <!-- title -->
  <text x="212" y="160" font-family="Impact, 'Arial Black', sans-serif" font-size="66" fill="url(#grit)" stroke="#1A1A1A" stroke-width="1">SUB-REMOVER</text>
  <rect x="214" y="180" width="356" height="3" fill="#F0F0F0"/>
  <text x="392" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" letter-spacing="1" fill="#F0F0F0">REMOVE UNWANTED SUBTITLES</text>
</svg>
