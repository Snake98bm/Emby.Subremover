name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Emby.Subremover/Emby.Subremover.csproj -c Release -nologo

      - name: Test
        run: dotnet test -c Release

      - name: Check it also compiles against the Emby 4.10 SDK
        run: dotnet build src/Emby.Subremover/Emby.Subremover.csproj -c Release -nologo -p:EmbySdkVersion=4.10.0.24-beta2 -o build-410

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Emby.Subremover-${{ github.sha }}
          path: src/Emby.Subremover/bin/Release/netstandard2.0/Emby.Subremover.dll

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" src/Emby.Subremover/bin/Release/netstandard2.0/Emby.Subremover.dll --title "${{ github.ref_name }}" --generate-notes
